[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "casefile-desk"
version = "0.1.0"
description = "Cybersecurity investigation desk: what happened, what supports it, what remains unknown."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Louis Boddie" }]
keywords = ["security", "investigation", "evidence", "nmap", "incident-response", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
casefile = "casefile.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
casefile = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
source = ["casefile"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S105", "S106", "S608"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/casefile"]
