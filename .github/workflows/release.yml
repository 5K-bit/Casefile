name: Release

# A tag publishes nothing until the full CI suite has passed on the tagged commit and the
# built wheel (not the source tree) has passed its own tests.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    name: validate (lint, types, tests, audit)
    uses: ./.github/workflows/ci.yml

  build:
    name: build and check
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Check the tag matches the package version
        run: |
          version="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version ${version}"; exit 1; }
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test-wheel:
    name: test the built wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install only the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl pytest
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: The CLI and import come from the wheel, at the tagged version
        run: |
          cd "$RUNNER_TEMP"
          python -c "import casefile; assert 'site-packages' in casefile.__file__, casefile.__file__"
          test "$(casefile --version)" = "casefile ${GITHUB_REF_NAME#v}"
          python -c "import importlib.resources as r; assert r.files('casefile').joinpath('py.typed').is_file()"
      - name: Run the lab investigation through the installed CLI
        run: |
          mkdir "$RUNNER_TEMP/lab" && cd "$RUNNER_TEMP/lab"
          bash "$GITHUB_WORKSPACE/.github/scripts/lab.sh"
      - name: Run the test suite against the installed wheel
        run: python -m pytest -p no:cacheprovider tests

  publish:
    name: publish release
    needs: test-wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
